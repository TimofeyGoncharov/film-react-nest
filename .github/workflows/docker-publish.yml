name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - review-3
  pull_request:
    branches:
      - main

# env:
#   # Use docker.io for Docker Hub if empty
#   REGISTRY: ghcr.io
#   # github.repository as <account>/<repo>
#   IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Вход в GitHub Container Registry
        run: echo "${{ secrets.GTB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Установка Buildx для Docker
        uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация фронтенда
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/timofigoncharov/film-react-nest/frontend:latest

      - name: Сборка и публикация бэкенда
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/timofigoncharov/film-react-nest/backend:latest
