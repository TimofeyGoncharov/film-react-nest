services:
  frontend:
    image: ghcr.io/timofigoncharov/film-react-nest_frontend:latest
    container_name: frontend
    volumes:
      - frontend:/app/dist
    networks:
      - webnetwork
    depends_on:
      - backend
    env_file:
      - frontend/.env

  backend:
    image: ghcr.io/timofigoncharov/film-react-nest_backend:latest
    container_name: backend
    env_file:
      - backend/.env
    networks:
      - webnetwork
    ports:
      - 3000:3000
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./backend/test/prac.init.sql:/docker-entrypoint-initdb.d/1_init.sql:ro
      - ./backend/test/prac.films.sql:/docker-entrypoint-initdb.d/2_films.sql:ro
      - ./backend/test/prac.schedules.sql:/docker-entrypoint-initdb.d/3_schedules.sql:ro
    networks:
      - webnetwork
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: fuck@email.mil
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - webnetwork
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend:/var/www/frontend:ro
    networks:
      - webnetwork
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  frontend:
  postgres:
  pgadmin:

networks:
  webnetwork:
