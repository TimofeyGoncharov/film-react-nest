services:
  backend:
    image: ghcr.io/timofigoncharov/film-react-nest_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      - db
    networks:
      - backend_network
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    image: ghcr.io/timofigoncharov/film-react-nest_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - backend_network
    volumes:
      - frontend_dist:/app/dist
    env_file:
      - frontend/.env

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: fuck@email.mil
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - pgadmin_data:/var/lib/pgadmin/data
    ports:
      - 8080:80
    networks:
      - backend_network
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres
    container_name: postgres
    networks:
      - backend_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
      PGDATA: /var/lib/postgresql/data/pgdata
    # ports:
    #   - 5438:5432
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx
    ports:
      - 80:80
      - 443:443
    networks:
      - frontend_network
      - backend_network
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/frontend:ro

networks:
  backend_network:
  frontend_network:

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:
